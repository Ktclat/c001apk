# This is a one-time source bootstrap for a previously empty repository.
# The font-related files already in this fork are deliberately NOT overwritten.
name: Import upstream c001apk

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'Ktclat/coolapk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout audited upstream revision
        uses: actions/checkout@v4
        with:
          repository: TG-Twilight/c001apk
          ref: f309b4382b5ef12675437d584487d54e5b890eee
          path: _upstream
          persist-credentials: false

      - name: Import missing sources without overwriting typography changes
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/flutter/lib/main.dart
          test -f apps/flutter/lib/utils/app_theme.dart
          test -f docs/FONT_GUIDE.md
          # Keep our modified files/README and import the rest, including
          # the complete upstream AGPL license, build scripts and assets.
          rsync -a --ignore-existing --exclude='.git' _upstream/ ./
          rm -rf _upstream
          test -f LICENSE
          test -f apps/flutter/pubspec.yaml
          test -f .github/workflows/build.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'Upstream source already present'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: import pinned c001apk source while retaining typography customization'
          git push origin HEAD:main
