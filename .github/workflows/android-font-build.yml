name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/android-font-build.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/android-font-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Flutter analysis and regression tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Fetch and verify Chinese fonts
        run: bash tools/fetch_fonts.sh
      - run: flutter pub get --enforce-lockfile
      - name: Verify pinned Android toolchain contract
        run: python3 tools/test_toolchain_contract.py
      - name: Verify standalone diagnostic source contract
        run: python3 tools/test_diagnostic_identity.py
      - name: Verify normal arm64 APK guard regressions
        run: python3 tools/test_normal_profile_apk.py
      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Isolated Hive account vault test
        run: timeout 90s flutter test --no-pub test/ui/account_vault_smoke_test.dart --reporter expanded
      - name: Typography and settings widget regressions
        run: timeout 150s flutter test --no-pub test/ui/account_settings_test.dart --reporter expanded
      - name: Account manager widget regressions
        run: timeout 150s flutter test --no-pub test/ui/accounts_page_test.dart --reporter expanded
      - name: Offline regression tests
        env:
          ICON_GRID_EVIDENCE: build/review/icon-grid
          GALLERY_EVIDENCE: build/review/gallery
          EMOTICON_EVIDENCE: build/review/emoticon
        run: |
          mkdir -p "$ICON_GRID_EVIDENCE/before" "$ICON_GRID_EVIDENCE/after" "$GALLERY_EVIDENCE" "$EMOTICON_EVIDENCE"
          record_review_evidence() {
            result=$?
            set +e
            for directory in "$ICON_GRID_EVIDENCE/after" "$GALLERY_EVIDENCE" "$EMOTICON_EVIDENCE"; do
              if [ -n "$(find "$directory" -type f -name '*.png' -print -quit)" ]; then
                printf '%s\n' "$result" > "$directory/test-exit.txt"
                find "$directory" -type f -name '*.png' -exec sha256sum {} + > "$directory/frames.sha256"
              fi
            done
            if [ -n "$(find "$GALLERY_EVIDENCE" -type f -name '*.png' -print -quit)" ]; then
              git rev-parse HEAD > "$GALLERY_EVIDENCE/source-commit.txt"
              sha256sum lib/components/imageview.dart lib/components/retryable_media_image.dart lib/pages/others/imageview_page.dart test/ui/gallery_states_test.dart test/ui/gallery_test_support.dart test/fixtures/gallery/* pubspec.lock > "$GALLERY_EVIDENCE/source.sha256"
              printf '%s\n' 'timeout 900s flutter test --no-pub --reporter expanded' > "$GALLERY_EVIDENCE/test-command.txt"
            fi
            if [ -n "$(find "$EMOTICON_EVIDENCE" -type f -name '*.png' -print -quit)" ]; then
              metadata_result=0
              git rev-parse HEAD > "$EMOTICON_EVIDENCE/source-commit.txt" || metadata_result=$?
              sha256sum lib/pages/feed/reply/insert_emote.dart lib/pages/feed/reply/reply_page.dart lib/pages/feed/reply/reply_dialog.dart lib/pages/feed/reply/toolbar_icon_button.dart lib/pages/feed/reply/emoji_panel.dart lib/utils/emoji_util.dart test/ui/insert_emote_test.dart test/ui/emote_selection_test.dart test/ui/emote_test_support.dart test/fixtures/gallery/portrait.png assets/emojis/* assets/fonts/*.otf pubspec.lock > "$EMOTICON_EVIDENCE/source.sha256" || metadata_result=$?
              find "$EMOTICON_EVIDENCE" -type f \( -name '*.png' -o -name '*.json' \) -exec sha256sum {} + > "$EMOTICON_EVIDENCE/captures.sha256" || metadata_result=$?
              printf '%s\n' 'timeout 900s flutter test --no-pub --reporter expanded' > "$EMOTICON_EVIDENCE/test-command.txt" || metadata_result=$?
              printf '%s\n' 'Offline real ReplyPage GetDialogRoute, not full Home app or physical device. PNG/JSON captures require visible original emoji art. test-exit.txt is the whole-suite exit; metadata-exit.txt is evidence recording status.' > "$EMOTICON_EVIDENCE/scope.txt" || metadata_result=$?
              printf '%s\n' "$metadata_result" > "$EMOTICON_EVIDENCE/metadata-exit.txt"
            fi
            exit "$result"
          }
          trap record_review_evidence EXIT
          timeout 900s flutter test --no-pub --reporter expanded
      - name: Upload synthetic icon-grid review
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-icon-grid-review
          path: apps/flutter/build/review/icon-grid/after/
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic gallery review
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-gallery-review
          path: apps/flutter/build/review/gallery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic emoticon review
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-emoticon-review
          path: apps/flutter/build/review/emoticon/
          if-no-files-found: error
          retention-days: 14
      - name: Standalone diagnostic widget regressions
        run: timeout 300s flutter test --no-pub --dart-define=APP_DIAGNOSTIC=true test/ui/navigation_adaptive_test.dart --name 'policy|diagnostics|motion' --reporter expanded
      - name: Upload synthetic typography review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-typography-review
          path: apps/flutter/build/review/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload synthetic dock-motion review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-dock-motion-review
          path: |
            apps/flutter/build/review/motion/*.png
            apps/flutter/build/review/motion/*.json
            apps/flutter/build/review/defaults/*.png
            apps/flutter/build/review/tab-drag/*.png
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Build Android debug and profile APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      # Serialize memory-heavy universal Flutter/Jetifier transforms and give
      # each APK invocation a fresh build JVM. Keep the project's heap limits.
      GRADLE_OPTS: '-Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false'
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Select Java 17 and Android SDK packages
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Fetch and verify Chinese fonts
        run: bash tools/fetch_fonts.sh
      - run: flutter pub get --enforce-lockfile
      - name: Compile Android debug APK
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: >-
          flutter build apk --debug --no-pub
          --dart-define=APP_BUILD_SHA="$(git rev-parse HEAD)"
          --dart-define=APP_SOURCE_SHA="$SOURCE_SHA"
          --dart-define=APP_BUILD_RUN="$BUILD_RUN"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-android-debug
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # AOT-compiled profile builds are more representative of real-world
      # navigation performance than JIT debug builds. They are not releases.
      - name: Compile Android profile APK
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: >-
          flutter build apk --profile --no-pub
          --dart-define=APP_BUILD_SHA="$(git rev-parse HEAD)"
          --dart-define=APP_SOURCE_SHA="$SOURCE_SHA"
          --dart-define=APP_BUILD_RUN="$BUILD_RUN"
      - name: Upload profile APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-android-profile
          path: apps/flutter/build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 14

      # Publish the normal arm64 app before any diagnostic Gradle/Dart opt-ins.
      - name: Compile normal arm64 profile APK
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: >-
          flutter build apk --profile --no-pub --split-per-abi --target-platform android-arm64
          --dart-define=APP_BUILD_SHA="$(git rev-parse HEAD)"
          --dart-define=APP_SOURCE_SHA="$SOURCE_SHA"
          --dart-define=APP_BUILD_RUN="$BUILD_RUN"
      - name: Verify normal arm64 profile APK before upload
        run: |
          python3 tools/verify_normal_profile_apk.py "$ANDROID_HOME/build-tools/35.0.0/aapt" build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk
          mkdir -p build/normal-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk build/normal-arm64/app-normal-arm64-profile.apk
      - name: Upload normal arm64 profile APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-android-profile-arm64
          path: apps/flutter/build/normal-arm64/app-normal-arm64-profile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compile standalone diagnostic profile APK
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_RUN: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_diagnosticBuild: 'true'
        run: >-
          flutter build apk --profile --no-pub
          --dart-define=APP_DIAGNOSTIC=true
          --dart-define=APP_BUILD_SHA="$(git rev-parse HEAD)"
          --dart-define=APP_SOURCE_SHA="$SOURCE_SHA"
          --dart-define=APP_BUILD_RUN="$BUILD_RUN"
      - name: Verify standalone APK identity before upload
        run: |
          python3 tools/verify_apk_identity.py "$ANDROID_HOME/build-tools/35.0.0/aapt" build/app/outputs/flutter-apk/app-profile.apk
          mkdir -p build/diagnostic
          cp build/app/outputs/flutter-apk/app-profile.apk build/diagnostic/app-diagnostic-profile.apk
      - name: Upload standalone diagnostic APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-android-motion-profile
          path: apps/flutter/build/diagnostic/app-diagnostic-profile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compile arm64 standalone motion profile APK
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_RUN: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_diagnosticBuild: 'true'
        run: >-
          flutter build apk --profile --no-pub --split-per-abi --target-platform android-arm64
          --dart-define=APP_DIAGNOSTIC=true
          --dart-define=APP_BUILD_SHA="$(git rev-parse HEAD)"
          --dart-define=APP_SOURCE_SHA="$SOURCE_SHA"
          --dart-define=APP_BUILD_RUN="$BUILD_RUN"
      - name: Verify arm64 motion APK before upload
        run: |
          python3 tools/verify_apk_identity.py "$ANDROID_HOME/build-tools/35.0.0/aapt" build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk arm64-v8a
          test "$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk)" -lt 50000000
          mkdir -p build/motion-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk build/motion-arm64/app-motion-arm64-profile.apk
      - name: Upload arm64 standalone motion APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-android-motion-arm64-profile
          path: apps/flutter/build/motion-arm64/app-motion-arm64-profile.apk
          if-no-files-found: error
          retention-days: 14
